name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test-windows:
    runs-on: windows-latest
    # 统一编译器消息语言：cl 的 "包含文件:" 前缀必须与 ninja 的 msvc_deps_prefix 对齐，
    # 否则本地化前缀漂移会让 ninja 解析 deps 失败（#deps 0），改 .cpp 不再触发重编。
    # 本作业当前用 VS 生成器（依赖跟踪走 .tlog），Configure 与 Build 同时生效，为未来切 Ninja 预先对齐。
    env:
      VSLANG: "1033"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # 依赖方向校验在 configure 阶段自动执行（CMake/CheckDependencies.cmake）：
      #   Engine* 不得依赖 UI*/Render*/Main；RenderX/RenderBridge 不得依赖 UI*/Main；
      #   UI* 只能经 UiEngineAccess 门面访问 Engine*。
      # 违规会让本步骤直接失败。
      # 注意：本作业是开发构建，未显式关闭许可校验；APR_ENABLE_LICENSE 默认 ON
      # （Config.cmake:237），因此本作业的许可校验为开启状态。如需开发构建关闭，
      # 显式传 -DAPR_ENABLE_LICENSE=OFF（宏由 License 库的 CMakeLists 编进 DLL 本身）；
      # 发货/Release 构建应断言该开关为 ON。
      - name: Configure
        run: |
          # APR_STRICT_DEPENDENCY_AUDIT=ON：所有 BUILD_xxx=ON 的模块目标都必须
          # 被 CMake/CheckDependencies.cmake 审计到；选项关掉的模块不算漏审。
          # 依赖方向违规会在本步骤直接失败，不需要等到链接期。
          cmake -B build -G "Visual Studio 17 2022" -A x64 \
            -DAPR_STRICT_DEPENDENCY_AUDIT=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_HARDWARE=OFF \
            -DBUILD_VISION=OFF \
            -DBUILD_ENGRAVING=OFF \
            -DBUILD_GEOMODELCORE=OFF \
            -DBUILD_PYTHON=OFF \
            -DAPR_PYBIND_CORE=OFF

      - name: Build
        run: |
          # 目标名必须与各模块 CMakeLists 里 add_executable 的真实名字一致：
          # 不存在的目标会让 --target 直接以非零退出（Ninja: "unknown target"，
          # 本作业的 VS 生成器同样会在 Build 步骤失败），不存在“静默忽略”。
          #
          # UI3D 的 ModelSplitPick/BRepUndo 依赖 BUILD_GEOMODELCORE=ON，
          # Relief 依赖 BUILD_ENGRAVING=ON；本作业为控制时长把两者关掉，
          # 因此这三个目标不在此列（不是用例被删，配置打开后仍会构建）。
          cmake --build build --config Debug --parallel \
            --target UICommon UI2D UI3D April \
            UtilityTests LogTests Engine2DTests Engine3DTests \
            FileIOTests NestingTests CAMTests \
            RenderxTests RenderBridgeTests MainTests \
            UI2DCoreTests TextEditServiceTests FillDialogColorTests \
            DialogDefaultsTests RasterImageBridgeTests RasterVectorizeTests \
            RasterBitmapProcessTests BooleanRoutingTests AsyncPipelineExecutorTests \
            UI3DCommandCatalogTests UI3DRenderMathTests UI3DEditServiceIdTests \
            UI3DRefreshTests UI3DOperationTests UI3DLightingTests UI3DExportTests \
            UI3DStorageTests UI3DEditTests UI3DChangeStreamTests \
            UI3DUndoRedoVisibilityTests UI3DCameraTests UI3DViewportMathTests \
            UI3DRenderPipelineTests

      # unity 依赖盲区体检（只读）：Ninja 下校验每个 unity 分块的 deps 记录是否覆盖
      # 它 #include 的全部 .cpp（#deps 0 会让改动静默不重编）。只跑 ninja -t deps，不构建。
      # 当前作业用 VS/MSBuild 生成器（依赖跟踪走 .tlog），本步会识别"无 .ninja_deps"并跳过；
      # 若本作业切到 Ninja 生成器，该步即成为真实门禁。放在 Build 之后，因为它依赖构建产物与 deps 库。
      - name: Audit unity dependency coverage
        run: python Tools/check_unity_deps.py --build-dir build

      - name: Test
        run: ctest --test-dir build -C Debug --output-on-failure --no-tests=error --parallel

  # /analyze 补上 MSVC 侧缺失的 printf 格式串校验（SAL 标注只在 /analyze 下生效，
  # 详见根 CMakeLists.txt 里 APR_MSVC_ANALYZE 的注释）。
  # 单独成一个作业而不是并进上面：/analyze 会让编译慢 2~3 倍，不该拖慢主构建与测试。
  # 该作业现在是阻塞门禁（2025 起已跑绿，不再继续放行告警）。
  static-analysis-windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure (analyze)
        run: |
          cmake -B build-analyze -G "Visual Studio 17 2022" -A x64 \
            -DAPR_MSVC_ANALYZE=ON \
            -DBUILD_TESTS=OFF \
            -DBUILD_HARDWARE=ON \
            -DBUILD_VISION=OFF \
            -DAPR_PYBIND_CORE=OFF

      - name: Analyze
        run: |
          cmake --build build-analyze --config Debug --parallel \
            --target UICommon UI2D UI3D April

  # ---------------------------------------------------------------------------
  # macOS / Linux 跨平台核心库验证（Nesting + GeoModelCore 独立构建）。
  #
  # 为什么只在这两个模块：Windows 主作业只 build UI 类目标，GeoModelCore（OCCT
  # 建模）、Nesting（套料）从没进过任何平台的 CI，但恰好这两处正是本轮审查里
  # 的跨平台风险点——Nesting 的 __int128 叉积（Geometry.cpp）与 GeoModelCore 的
  # 网格 float 管线。两者均无 Qt/UI 依赖，独立入口（各自根 CMakeLists.txt）沿用
  # 仓库统一的 Config.cmake + StandaloneInit.cmake，配 vcpkg 即可编译测试。
  #
  # 全应用（Qt + 全套 vcpkg 依赖）的 mac/Linux 构建见下方 full-app-macos-linux。
  # ---------------------------------------------------------------------------
  core-libs-macos-linux:
    name: core libs (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            triplet: arm64-osx
          - os: ubuntu-22.04
            triplet: x64-linux
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # vcpkg 与仓库根 vcpkg.json 的 builtin-baseline 同提交，缓存键随 baseline
      # 变化自动失效，避免三方库每次都源码重编（OCCT 纯源码构建约 30~40 分钟）。
      - name: Read vcpkg baseline
        run: |
          echo "VCPKG_BASELINE=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')" >> "$GITHUB_ENV"

      - name: Cache vcpkg
        id: cache-vcpkg
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}/vcpkg
          key: vcpkg-${{ matrix.triplet }}-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_BASELINE }}

      - name: Set up vcpkg
        run: |
          if [ ! -x "$GITHUB_WORKSPACE/vcpkg/vcpkg" ]; then
            rm -rf "$GITHUB_WORKSPACE/vcpkg"
            git init "$GITHUB_WORKSPACE/vcpkg"
            git -C "$GITHUB_WORKSPACE/vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
            git -C "$GITHUB_WORKSPACE/vcpkg" fetch --depth 1 origin "$VCPKG_BASELINE"
            git -C "$GITHUB_WORKSPACE/vcpkg" checkout --detach FETCH_HEAD
            "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          fi
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"

      # 两个模块共享的三方依赖一次装齐：OCCT（GeoModelCore）+ Clipper2/GTest（Nesting）
      - name: Install dependencies
        run: |
          "$VCPKG_ROOT/vcpkg" install opencascade clipper2 gtest --triplet ${{ matrix.triplet }} --clean-after-build

      - name: Configure & test Nesting
        run: |
          cmake -S Nesting -B build-nesting -DVCPKG_DIR="$VCPKG_ROOT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_NESTING_EXAMPLES=OFF \
            -DBUILD_TESTS=ON \
            -DNESTING_WITH_LOG=OFF
          cmake --build build-nesting --parallel
          ctest --test-dir build-nesting -C Release --output-on-failure --no-tests=error --parallel

      - name: Configure & test GeoModelCore
        run: |
          cmake -S GeoModelCore -B build-gmc -DVCPKG_DIR="$VCPKG_ROOT" \
            -DCMAKE_BUILD_TYPE=Release \
            -DBUILD_GEOMODELCORE_EXAMPLE=OFF \
            -DBUILD_TESTS=ON
          cmake --build build-gmc --parallel
          ctest --test-dir build-gmc -C Release --output-on-failure --no-tests=error --parallel

  # ---------------------------------------------------------------------------
  # 全应用（Qt + vcpkg 依赖）macOS / Linux 构建与测试。
  #
  # 覆盖矩阵：macos-14 / Debug 与 ubuntu-22.04 / Release，满足「Debug 与 Release
  # 至少各一种」。依赖全部在作业内获取，不依赖 runner 预装：
  #   Qt 6.12.0   —— jurplel/install-qt-action
  #   Python 3.11 —— actions/setup-python
  #   pybind11    —— pip（刻意不用 vcpkg 的 pybind11：它会接管 FindPython，
  #                  把扩展 ABI 换到 vcpkg python3，见 Config.cmake 注释）
  #   vcpkg       —— 从 vcpkg.json 的 builtin-baseline 读取固定提交并 bootstrap，
  #                  configure 阶段以 manifest 模式安装锁定版本
  #
  # 模块范围与 Windows 主作业一致（GeoModelCore / Vision / Engraving / Hardware
  # 关闭）。Nesting / CAM / Raster 默认开启，因此 manifest 的核心依赖包含
  # clipper2 与 opencv4；启用 GeoModelCore / Engraving 时追加
  # -DVCPKG_MANIFEST_FEATURES=opencascade。OCCT 不进入本作业，避免其编译时间
  # 叠加到每次提交。
  # ---------------------------------------------------------------------------
  full-app-macos-linux:
    name: full app (${{ matrix.os }}, ${{ matrix.build_type }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            build_type: Debug
            triplet: arm64-osx
            qt_arch: clang_64
          - os: ubuntu-22.04
            build_type: Release
            triplet: x64-linux
            qt_arch: linux_gcc_64
    env:
      QT_VERSION: "6.12.0"
      VCPKG_TRIPLET: ${{ matrix.triplet }}
      # Linux 无显示服务器：GUI 测试统一走 Qt offscreen 平台。
      QT_QPA_PLATFORM: offscreen
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install system packages (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgl1-mesa-dev libegl1-mesa-dev \
            libxkbcommon-dev libxkbcommon-x11-dev libfontconfig1-dev \
            libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-shape0 libxcb-xkb-dev libxcb-xinerama0 libdbus-1-3 patchelf

      - name: Install Qt ${{ env.QT_VERSION }}
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          host: ${{ runner.os == 'macOS' && 'mac' || 'linux' }}
          target: desktop
          arch: ${{ matrix.qt_arch }}
          modules: qtbase
          cache: true

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install pybind11
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install "pybind11>=2.11"
          echo "PYBIND11_DIR=$(python3 -m pybind11 --cmakedir)" >> "$GITHUB_ENV"

      # vcpkg 版本锁定的唯一来源是 vcpkg.json 的 builtin-baseline；CI 不重复写死。
      - name: Read vcpkg baseline
        run: |
          echo "VCPKG_BASELINE=$(python3 -c 'import json; print(json.load(open("vcpkg.json"))["builtin-baseline"])')" >> "$GITHUB_ENV"

      # vcpkg 二进制缓存 + 已安装树：按 baseline + triplet 失效，避免 OpenCV 每次重编。
      - name: Cache vcpkg packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/vcpkg/archives
            ${{ github.workspace }}/.vcpkg/installed
          key: vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ env.VCPKG_BASELINE }}

      - name: Setup vcpkg (pinned baseline)
        run: |
          git init "$GITHUB_WORKSPACE/vcpkg"
          git -C "$GITHUB_WORKSPACE/vcpkg" remote add origin https://github.com/microsoft/vcpkg.git
          git -C "$GITHUB_WORKSPACE/vcpkg" fetch --depth 1 origin "$VCPKG_BASELINE"
          git -C "$GITHUB_WORKSPACE/vcpkg" checkout --detach FETCH_HEAD
          "$GITHUB_WORKSPACE/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          echo "VCPKG_ROOT=$GITHUB_WORKSPACE/vcpkg" >> "$GITHUB_ENV"
          echo "VCPKG_BINARY_SOURCES=clear;files,$HOME/.cache/vcpkg/archives,readwrite" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cmake -S . -B build-ci -G Ninja \
            -DCMAKE_BUILD_TYPE="${{ matrix.build_type }}" \
            -DQt_INSTALL_DIR="$QT_ROOT_DIR" \
            -DVCPKG_DIR="$VCPKG_ROOT" \
            -DVCPKG_TARGET_TRIPLET="$VCPKG_TRIPLET" \
            -DVCPKG_MANIFEST_MODE=ON \
            -DVCPKG_INSTALLED_DIR="$GITHUB_WORKSPACE/.vcpkg/installed" \
            -DPython_EXECUTABLE="$(command -v python3)" \
            -Dpybind11_DIR="$PYBIND11_DIR" \
            -DAPR_STRICT_DEPENDENCY_AUDIT=ON \
            -DBUILD_TESTS=ON \
            -DBUILD_NESTING=ON \
            -DBUILD_CAM=ON \
            -DBUILD_RASTER=ON \
            -DBUILD_CRASHHANDLER=ON \
            -DBUILD_HARDWARE=OFF \
            -DBUILD_VISION=OFF \
            -DBUILD_ENGRAVING=OFF \
            -DBUILD_GEOMODELCORE=OFF \
            -DBUILD_PYTHON=ON \
            -DAPR_PYBIND_CORE=ON \
            -DAPR_BUILD_CLIENT_PLUGINS=OFF \
            -DBUILD_PERF_BENCHMARK=OFF \
            -DBUILD_RENDER_BENCHMARK=OFF

      - name: Build
        run: |
          # 目标名必须与各模块 CMakeLists 里 add_executable 的真实名字一致：
          # 不存在的目标会让 cmake --build --target 以非零退出（Ninja 报
          # "unknown target"），不会静默忽略。
          #
          # UI3D 的 ModelSplitPick/BRepUndo 依赖 BUILD_GEOMODELCORE=ON，
          # Relief 依赖 BUILD_ENGRAVING=ON；本作业为控制时长把两者关掉，
          # 因此这三个目标不在此列（不是用例被删，配置打开后仍会构建）。
          cmake --build build-ci --config "${{ matrix.build_type }}" --parallel \
            --target UICommon UI2D UI3D April PythonHost AprPyBindCore \
            UtilityTests LogTests EngineCommonTests Engine2DTests Engine3DTests \
            FileIOTests NestingTests CAMTests RenderxTests RenderBridgeTests \
            LicenseTests CrashHandlerTests PythonHostTests \
            UI2DCoreTests TextEditServiceTests FillDialogColorTests \
            DialogDefaultsTests RasterImageBridgeTests RasterVectorizeTests \
            RasterBitmapProcessTests BooleanRoutingTests AsyncPipelineExecutorTests \
            UI3DCommandCatalogTests UI3DRenderMathTests UI3DEditServiceIdTests \
            UI3DRefreshTests UI3DOperationTests UI3DLightingTests UI3DExportTests \
            UI3DStorageTests UI3DEditTests UI3DChangeStreamTests \
            UI3DUndoRedoVisibilityTests UI3DCameraTests UI3DViewportMathTests \
            UI3DRenderPipelineTests \
            MainTests

      - name: Test
        run: |
          ctest --test-dir build-ci -C "${{ matrix.build_type }}" \
            --output-on-failure --no-tests=error --parallel

  # ---------------------------------------------------------------------------
  # 文档链接与过期检查
  #
  # 检查：
  #   - Markdown 相对链接/图片是否指向存在的文件
  #   - 文档是否被 README 或 Docs/00-索引与总览/ 下的索引文档链接
  #   - 最后修改时间是否超过 365 天（默认）或状态说明日期超过 180 天
  #   - 可选检查锚点 --check-anchors
  #
  # 只在 PR/推送时运行，不阻塞主构建的并行度。
  # ---------------------------------------------------------------------------
  docs-check:
    name: Docs check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 需要完整历史做 git log 过期检查
      - name: Check docs links & freshness
        run: python3 Tools/docs_check.py --fail-on-stale --max-age-days 365 --review-max-age-days 180
