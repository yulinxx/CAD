name: Engraving MeshSlicer Tests

on:
  push:
    branches: [main, master, develop]
  pull_request:

jobs:
  mesh-slicer-tests:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # vcpkg 版本只由仓库根 vcpkg.json 的 builtin-baseline 决定，避免上游滚动导致
      # 同一提交在不同时间装到不同的 OpenCV/GTest。
      - name: Read vcpkg baseline
        run: |
          $baseline = (Get-Content vcpkg.json -Raw | ConvertFrom-Json).'builtin-baseline'
          "VCPKG_BASELINE=$baseline" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup vcpkg
        run: |
          $vcpkgRoot = Join-Path $env:RUNNER_TEMP "vcpkg"
          git init $vcpkgRoot
          git -C $vcpkgRoot remote add origin https://github.com/microsoft/vcpkg.git
          git -C $vcpkgRoot fetch --depth 1 origin $env:VCPKG_BASELINE
          git -C $vcpkgRoot checkout --detach FETCH_HEAD
          & (Join-Path $vcpkgRoot "bootstrap-vcpkg.bat") -disableMetrics
          "VCPKG_ROOT=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "VCPKG_DEFAULT_TRIPLET=x64-windows" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: |
          & "$env:VCPKG_ROOT/vcpkg.exe" install opencv4 gtest --triplet x64-windows

      - name: Configure
        run: |
          cmake -B build-ci -S Engraving/ci `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -A x64

      - name: Build tests
        run: cmake --build build-ci --config Release --target EngravingMeshSlicerTests

      - name: Run tests
        run: |
          $exe = Get-ChildItem -Path build-ci -Recurse -Filter EngravingMeshSlicerTests.exe | Select-Object -First 1
          if (-not $exe) { throw "EngravingMeshSlicerTests.exe not found" }
          & $exe.FullName

      - name: CTest
        run: ctest --test-dir build-ci -C Release --output-on-failure --no-tests=error
